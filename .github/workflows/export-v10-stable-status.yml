name: Export v10 stable APK status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-v10-stable-status.yml'

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export stable v10 build status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: 3b960d6d183484fa518e4db5a4ce22a5b167c06d
        run: |
          for i in $(seq 1 24); do
            JSON="$(gh api "repos/$REPO/actions/workflows/android-ci.yml/runs?branch=main&per_page=20")"
            RUN_ID="$(printf '%s' "$JSON" | jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .id' | head -n 1)"
            if [ -n "$RUN_ID" ]; then
              STATUS="$(printf '%s' "$JSON" | jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .status' | head -n 1)"
              CONCLUSION="$(printf '%s' "$JSON" | jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .conclusion' | head -n 1)"
              printf 'run_id=%s\nstatus=%s\nconclusion=%s\nhead_sha=%s\n' "$RUN_ID" "$STATUS" "$CONCLUSION" "$TARGET_SHA" > latest-v10-stable-status.txt
              break
            fi
            sleep 5
          done
          test -f latest-v10-stable-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-v10-stable-status.txt
          git commit -m 'Export v10 stable APK status'
          git push
