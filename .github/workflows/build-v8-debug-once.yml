name: Build v8 debug once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v8-debug-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install stable SocialDiet debug keystore
        env:
          SOCIALDIET_DEBUG_KEYSTORE_BASE64: ${{ secrets.SOCIALDIET_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$SOCIALDIET_DEBUG_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$SOCIALDIET_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          EXPECTED_SHA1="4F:33:17:31:50:68:E9:DA:7F:67:96:73:F9:B2:90:60:6D:25:8D:E8"
          ACTUAL_SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | sed -n 's/.*SHA1: //p' | head -n 1)"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

      - name: Fetch on-device nutrition model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --output app/src/main/assets/image2nutrition.tflite "https://raw.githubusercontent.com/dant4ick/plate_track_ai/54ceb65915dc708f452b9f6830f1eb9ac27d17a5/assets/ml/image2nutrition.tflite"
          test "$(stat -c%s app/src/main/assets/image2nutrition.tflite)" -eq 26371792

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Verify APK signing certificate
        run: |
          EXPECTED_SHA1="4F:33:17:31:50:68:E9:DA:7F:67:96:73:F9:B2:90:60:6D:25:8D:E8"
          ACTUAL_SHA1="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/Signer #1 certificate SHA-1 digest: //p' | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//' | head -n 1)"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

      - name: Upload v8 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: socialdiet-v8-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Export run id
        run: |
          printf 'run_id=%s\nartifact_name=socialdiet-v8-debug-apk\n' "$GITHUB_RUN_ID" > latest-v8-debug-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-v8-debug-run.txt
          git commit -m 'Export v8 debug run id'
          git push
