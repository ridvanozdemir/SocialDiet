name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: /tmp/huggingface
      TF_CPP_MIN_LOG_LEVEL: "2"
      HEAD_EPOCHS: "4"
      FINE_TUNE_EPOCHS: "1"
      BATCH_SIZE: "64"
      IMAGE_SIZE: "160"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install stable SocialDiet debug keystore
        env:
          SOCIALDIET_DEBUG_KEYSTORE_BASE64: ${{ secrets.SOCIALDIET_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$SOCIALDIET_DEBUG_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$SOCIALDIET_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          EXPECTED_SHA1="4F:33:17:31:50:68:E9:DA:7F:67:96:73:F9:B2:90:60:6D:25:8D:E8"
          ACTUAL_SHA1="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            | sed -n 's/.*SHA1: //p' | head -n 1)"

          echo "Debug signing SHA-1: $ACTUAL_SHA1"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare both AI models
        run: |
          mkdir -p app/src/main/assets

          curl --fail --location --retry 3 \
            --output app/src/main/assets/image2nutrition.tflite \
            "https://raw.githubusercontent.com/dant4ick/plate_track_ai/54ceb65915dc708f452b9f6830f1eb9ac27d17a5/assets/ml/image2nutrition.tflite"
          test "$(stat -c%s app/src/main/assets/image2nutrition.tflite)" -eq 26371792

          if [ ! -s app/src/main/assets/turkish_food_classifier.tflite ] || \
             [ ! -s app/src/main/assets/turkish_food_labels.txt ]; then
            echo "Committed Turkish classifier is missing; training a fallback model for this build."
            python -m pip install --upgrade pip
            pip install "tensorflow-cpu==2.19.1" "datasets==3.6.0" "pillow==11.2.1"
            python ml/train_turkish_food.py
            cp ml/output/turkish_food_classifier.tflite app/src/main/assets/turkish_food_classifier.tflite
            cp ml/output/turkish_food_labels.txt app/src/main/assets/turkish_food_labels.txt
          fi

          test -s app/src/main/assets/turkish_food_classifier.tflite
          test "$(stat -c%s app/src/main/assets/turkish_food_classifier.tflite)" -gt 1000000
          test -s app/src/main/assets/turkish_food_labels.txt
          test "$(wc -l < app/src/main/assets/turkish_food_labels.txt)" -eq 25

          echo "AI asset sizes:"
          stat -c '%n %s bytes' app/src/main/assets/image2nutrition.tflite \
            app/src/main/assets/turkish_food_classifier.tflite \
            app/src/main/assets/turkish_food_labels.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Verify APK contains both AI models
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/image2nutrition.tflite'
          unzip -l "$APK" | grep -q 'assets/turkish_food_classifier.tflite'
          unzip -l "$APK" | grep -q 'assets/turkish_food_labels.txt'

      - name: Verify APK signing certificate
        run: |
          EXPECTED_SHA1="4F:33:17:31:50:68:E9:DA:7F:67:96:73:F9:B2:90:60:6D:25:8D:E8"
          ACTUAL_SHA1="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/Signer #1 certificate SHA-1 digest: //p' \
            | tr '[:lower:]' '[:upper:]' \
            | sed 's/../&:/g; s/:$//' \
            | head -n 1)"

          echo "APK signing SHA-1: $ACTUAL_SHA1"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: socialdiet-v13-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
