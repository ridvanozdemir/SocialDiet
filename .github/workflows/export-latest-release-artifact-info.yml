name: Export latest release artifact info

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-latest-release-artifact-info.yml'

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest successful Release AAB artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          RUN_JSON="$(gh api "repos/$REPO/actions/workflows/release-aab.yml/runs?branch=main&event=workflow_dispatch&status=success&per_page=1")"
          RUN_ID="$(printf '%s' "$RUN_JSON" | jq -r '.workflow_runs[0].id')"
          test -n "$RUN_ID"
          test "$RUN_ID" != "null"

          ART_JSON="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts")"
          ART_ID="$(printf '%s' "$ART_JSON" | jq -r '.artifacts[] | select(.name=="socialdiet-release-aab-v6") | .id' | head -n 1)"
          ART_NAME="$(printf '%s' "$ART_JSON" | jq -r '.artifacts[] | select(.name=="socialdiet-release-aab-v6") | .name' | head -n 1)"
          test -n "$ART_ID"
          test "$ART_ID" != "null"

          printf 'run_id=%s\nartifact_id=%s\nartifact_name=%s\n' "$RUN_ID" "$ART_ID" "$ART_NAME" > latest-release-artifact-info.txt

      - name: Commit artifact info
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-release-artifact-info.txt
          git commit -m 'Export latest release artifact info'
          git push
