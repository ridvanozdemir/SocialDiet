name: Apply v11 Email Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v11-email-only.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove Google sign-in UI and add AI test warning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          auth_path = Path('app/src/main/java/com/ridvanozdemir/socialdiet/ui/screens/AuthScreen.kt')
          auth = auth_path.read_text()

          # Imports/state used only by the Google sign-in button.
          for line in [
              'import androidx.compose.material3.OutlinedButton\n',
              'import androidx.compose.runtime.rememberCoroutineScope\n',
              'import androidx.compose.ui.platform.LocalContext\n',
              'import com.ridvanozdemir.socialdiet.auth.GoogleCredentialHelper\n',
              'import kotlinx.coroutines.launch\n',
          ]:
              auth = auth.replace(line, '')
          auth = auth.replace('    val context = LocalContext.current\n', '')
          auth = auth.replace('    val scope = rememberCoroutineScope()\n', '')

          # Remove the complete divider + Google button while keeping email/password auth.
          pattern = re.compile(
              r'\n        Text\("veya", modifier = Modifier\.padding\(vertical = 8\.dp\)\)\n\n'
              r'        OutlinedButton\([\s\S]*?\n        \) \{\n            Text\("Google ile devam et"\)\n        \}\n',
              re.MULTILINE,
          )
          auth, count = pattern.subn('\n', auth, count=1)
          if count != 1:
              raise SystemExit('Google sign-in UI block not found exactly once')
          auth_path.write_text(auth)

          meal_path = Path('app/src/main/java/com/ridvanozdemir/socialdiet/ui/screens/MealScreen.kt')
          meal = meal_path.read_text()
          marker = '            Text("AI tahmini", style = MaterialTheme.typography.titleLarge)\n'
          warning = '''            Text("AI tahmini", style = MaterialTheme.typography.titleLarge)\n            Text(\n                "⚠ AI ile kalori tahmini test aşamasındadır. Sonuçlar yaklaşık olabilir; kaydetmeden önce porsiyon ve kalori değerlerini kontrol edin.",\n                color = MaterialTheme.colorScheme.error,\n                style = MaterialTheme.typography.bodyMedium\n            )\n'''
          if marker not in meal:
              raise SystemExit('AI result title marker not found')
          meal = meal.replace(marker, warning, 1)

          old_note = '''            "Not: Fotoğraftan kalori ve porsiyon hesabı yaklaşık bir AI tahminidir. " +\n                "Kaydetmeden önce yemek türünü, porsiyonu ve kaloriyi düzeltebilirsin.",'''
          new_note = '''            "Test aşamasında: Fotoğraftan kalori ve porsiyon hesabı yaklaşık bir AI tahminidir. " +\n                "Sağlık veya tıbbi kararlar için kullanılmamalıdır; kaydetmeden önce yemek türünü, porsiyonu ve kaloriyi kontrol edin.",'''
          if old_note not in meal:
              raise SystemExit('Existing AI disclaimer not found')
          meal = meal.replace(old_note, new_note, 1)
          meal_path.write_text(meal)

          gradle_path = Path('app/build.gradle.kts')
          gradle = gradle_path.read_text()
          gradle = re.sub(r'versionCode = \d+', 'versionCode = 11', gradle, count=1)
          gradle = re.sub(r'versionName = "[^"]+"', 'versionName = "0.3.8"', gradle, count=1)
          gradle_path.write_text(gradle)

          release_path = Path('.github/workflows/release-aab.yml')
          release = release_path.read_text()
          release = re.sub(r'name: socialdiet-release-aab-v\d+', 'name: socialdiet-release-aab-v11', release)
          release_path.write_text(release)
          PY

      - name: Commit v11 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/ridvanozdemir/socialdiet/ui/screens/AuthScreen.kt \
                  app/src/main/java/com/ridvanozdemir/socialdiet/ui/screens/MealScreen.kt \
                  app/build.gradle.kts \
                  .github/workflows/release-aab.yml
          git commit -m 'Remove Google sign-in UI and mark AI calorie estimate as testing'
          git push
