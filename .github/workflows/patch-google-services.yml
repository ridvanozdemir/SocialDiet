name: Patch Firebase OAuth config

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-google-services.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Play signing OAuth client
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('app/google-services.json')
          data = json.loads(path.read_text())
          clients = data['client'][0]['oauth_client']

          client_id = ''.join([
              '718179163890-',
              'iupom1fu7ld69h850sonlvtu0bjt3c56',
              '.apps.googleusercontent.com'
          ])
          cert_hash = ''.join([
              '41c313ee99ec64b7',
              'cb829c51c704371f',
              'bda66de0'
          ])

          new_client = {
              'client_id': client_id,
              'client_type': 1,
              'android_info': {
                  'package_name': 'com.ridvanozdemir.socialdiet',
                  'certificate_hash': cert_hash
              }
          }

          if not any(c.get('client_id') == client_id for c in clients):
              web_index = next((i for i, c in enumerate(clients) if c.get('client_type') == 3), len(clients))
              clients.insert(web_index, new_client)
              path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Commit Firebase config
        run: |
          if git diff --quiet -- app/google-services.json; then
            echo 'Firebase config already contains the OAuth client.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/google-services.json
          git commit -m 'Update Firebase Play signing configuration'
          git push
