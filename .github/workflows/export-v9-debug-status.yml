name: Export v9 debug status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-v9-debug-status.yml'

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export latest v9 debug run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sleep 20
          JSON="$(gh api "repos/$REPO/actions/workflows/build-v9-debug-once.yml/runs?branch=main&per_page=1")"
          RUN_ID="$(printf '%s' "$JSON" | jq -r '.workflow_runs[0].id')"
          STATUS="$(printf '%s' "$JSON" | jq -r '.workflow_runs[0].status')"
          CONCLUSION="$(printf '%s' "$JSON" | jq -r '.workflow_runs[0].conclusion')"
          printf 'run_id=%s\nstatus=%s\nconclusion=%s\n' "$RUN_ID" "$STATUS" "$CONCLUSION" > latest-v9-debug-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-v9-debug-status.txt
          git commit -m 'Export v9 debug status'
          git push
