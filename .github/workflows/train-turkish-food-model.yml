name: Train Turkish Food Model

on:
  push:
    branches: [ "main" ]
    paths:
      - "ml/**"
      - ".github/workflows/train-turkish-food-model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: /tmp/huggingface
      TF_CPP_MIN_LOG_LEVEL: "2"
      HEAD_EPOCHS: "4"
      FINE_TUNE_EPOCHS: "1"
      BATCH_SIZE: "64"
      IMAGE_SIZE: "160"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "tensorflow-cpu==2.19.1" "datasets==3.6.0" "pillow==11.2.1"

      - name: Train MobileNetV3 TurkishFoods-25 classifier
        run: python ml/train_turkish_food.py

      - name: Show model metrics
        run: cat ml/output/metrics.json

      - name: Validate trained Turkish classifier
        run: |
          test -s ml/output/turkish_food_classifier.tflite
          test -s ml/output/turkish_food_labels.txt
          test "$(wc -l < ml/output/turkish_food_labels.txt)" -eq 25
          test "$(stat -c%s ml/output/turkish_food_classifier.tflite)" -gt 1000000

      - name: Upload trained Turkish classifier
        uses: actions/upload-artifact@v4
        with:
          name: socialdiet-turkish-food-model
          path: |
            ml/output/turkish_food_classifier.tflite
            ml/output/turkish_food_labels.txt
            ml/output/metrics.json
          retention-days: 90

      - name: Persist trained Turkish model assets
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p app/src/main/assets
          cp ml/output/turkish_food_classifier.tflite app/src/main/assets/turkish_food_classifier.tflite
          cp ml/output/turkish_food_labels.txt app/src/main/assets/turkish_food_labels.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/turkish_food_classifier.tflite app/src/main/assets/turkish_food_labels.txt
          if git diff --cached --quiet; then
            echo "Turkish model assets are already current."
          else
            git commit -m "Update Turkish food classifier assets"
            git push origin HEAD:main
          fi
